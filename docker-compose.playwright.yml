# Optional Playwright compose (heavier). Prefer building on VPS then load on N1.
#   ./scripts/build-arm64-export.sh playwright
#   docker load -i dist/qwen-2api-1.2.0-playwright-arm64.tar
services:
  qwen-2api:
    image: qwen-2api:1.2.0-playwright-arm64
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: qwen-2api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      TZ: Asia/Shanghai
      NODE_ENV: production
      WAF_AUTO_HARVEST: "1"
      WAF_PROFILE_DIR: /app/data/chrome-profile-waf
      WAF_COOKIE_CACHE: /app/data/waf-cookies.json
      WAF_COOKIE_REFRESH_MS: "1200000"
      WAF_COOKIE_WARMUP_MS: "5000"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./data:/app/data
    shm_size: "256mb"
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
