# N1 / OpenWrt lightweight compose (API only, no Playwright)
# Prefer loading a prebuilt arm64 image from VPS:
#   docker load -i qwen-2api-1.2.0-arm64.tar
# then:
#   docker compose up -d
services:
  qwen-2api:
    image: qwen-2api:1.2.0-arm64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen-2api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      TZ: Asia/Shanghai
      NODE_ENV: production
      WAF_AUTO_HARVEST: "0"
      WAF_COOKIE_CACHE: /app/data/waf-cookies.json
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s
