name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VALUE="${GITHUB_REF##*/}"
          else
            VALUE="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          VALUE="$(printf '%s' "$VALUE" | tr -d '[:space:]')"
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TAG=${VALUE}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Playwright image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.playwright
          platforms: linux/arm64
          load: true
          tags: qwen-2api:playwright
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image
        run: |
          mkdir -p dist
          TAR="dist/qwen-2api-playwright-${BUILD_TAG}-arm64.tar"
          docker save qwen-2api:playwright -o "$TAR"
          echo "TAR_NAME=$(basename "$TAR")" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Compress (zstd, max)
        run: |
          cd dist
          SRC="qwen-2api-playwright-${BUILD_TAG}-arm64.tar"
          zstd -T0 -19 --long=31 "$SRC"
          rm -f "$SRC"
          ls -lh
          ZST="$(ls *.tar.zst | head -1)"
          echo "ZST_NAME=$ZST" >> "$GITHUB_ENV"
          echo "ZST_SIZE_MB=$(du -m "$ZST" | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload artifact (tar.zst only)
        uses: actions/upload-artifact@v4
        with:
          name: qwen-2api-playwright-arm64
          path: dist/qwen-2api-playwright-${{ env.BUILD_TAG }}-arm64.tar.zst
          retention-days: 14
          compression-level: 0

      - name: Create Release with zst
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: qwen-2api ${{ env.BUILD_TAG }}
          files: dist/*.tar.zst
          body: |
            ## Playwright arm64 镜像（zstd 压缩）

            下载 `*.tar.zst` 后在 N1 上：
            ```bash
            # OpenWrt 装 zstd：opkg install zstd
            zstd -d qwen-2api-playwright-${{ env.BUILD_TAG }}-arm64.tar.zst
            docker load -i qwen-2api-playwright-${{ env.BUILD_TAG }}-arm64.tar
            docker compose -f docker-compose.playwright.yml up -d
            ```

      - name: Summary
        run: |
          {
          echo "## Playwright arm64 构建完成 🎉"
          echo ""
          echo "| 产物 | 大小 |"
          echo "|------|------|"
          echo "| \`${ZST_NAME}\` | ${ZST_SIZE_MB} MB |"
          echo ""
          echo "### 在 N1 上使用（zstd 压缩版）"
          echo '```bash'
          echo "# OpenWrt 装 zstd：opkg install zstd"
          echo "wget -O qwen.tar.zst '<release 下载链接>'"
          echo "zstd -d qwen.tar.zst"
          echo "docker load -i ${TAR_NAME}"
          echo "docker compose -f docker-compose.playwright.yml up -d"
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY"