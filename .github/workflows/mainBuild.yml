name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Playwright image
        uses: docker/build-push-action@v6
        with:
          context: ./qwen-2api-openwrt
          file: ./qwen-2api-openwrt/Dockerfile.playwright
          platforms: linux/arm64
          load: true
          tags: qwen-2api:playwright

      - name: Save image
        run: |
          TAG=${GITHUB_REF##*/}
          docker save qwen-2api:playwright -o qwen-2api-playwright-${TAG}-arm64.tar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: qwen-2api-playwright-${TAG}-arm64.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
