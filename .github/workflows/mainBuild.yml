name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  PLATFORM: linux/arm64
  MAIN_IMAGE: ghcr.io/thisko/q2api
  HARVESTER_IMAGE: ghcr.io/thisko/qwaf-harvester

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VALUE="${GITHUB_REF##*/}"
          else
            VALUE="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          VALUE="$(printf '%s' "$VALUE" | tr -d '[:space:]')"
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TAG=${VALUE}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push qwen-2api (lightweight main image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ env.MAIN_IMAGE }}:${{ env.BUILD_TAG }}
            ${{ env.MAIN_IMAGE }}:latest
          cache-from: type=gha,scope=qwen-2api
          cache-to: type=gha,mode=max,scope=qwen-2api

      - name: Build & push waf-harvester (Chromium sidecar)
        uses: docker/build-push-action@v6
        with:
          context: ./waf-harvester
          file: ./waf-harvester/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ env.HARVESTER_IMAGE }}:${{ env.BUILD_TAG }}
            ${{ env.HARVESTER_IMAGE }}:latest
          cache-from: type=gha,scope=waf-harvester
          cache-to: type=gha,mode=max,scope=waf-harvester

      - name: Summary
        run: |
          {
          echo "## 双镜像 arm64 已推送到 GHCR 🎉"
          echo ""
          echo "| 镜像 | pull 命令 |"
          echo "|------|-----------|"
          echo "| 主服务 | \`docker pull ${MAIN_IMAGE}:${BUILD_TAG}\` |"
          echo "| harvester | \`docker pull ${HARVESTER_IMAGE}:${BUILD_TAG}\` |"
          echo ""
          echo "### N1 上使用"
          echo '```bash'
          echo "docker login ghcr.io -u Thisko -p ghp_你的read:packages_token"
          echo "docker pull ${MAIN_IMAGE}:latest"
          echo "docker pull ${HARVESTER_IMAGE}:latest"
          echo "docker compose -f docker-compose.n1.yml up -d"
          echo '```'
          echo ""
          echo "### 离线备用：本地交叉构建 tar"
          echo '```bash'
          echo "./scripts/build-all.sh  # 产出 dist/*.tar"
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY"