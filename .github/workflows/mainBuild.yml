name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PLATFORM: linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VALUE="${GITHUB_REF##*/}"
          else
            VALUE="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          VALUE="$(printf '%s' "$VALUE" | tr -d '[:space:]')"
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TAG=${VALUE}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build qwen-2api (lightweight main image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: qwen-2api:1.2.0-arm64
          cache-from: type=gha,scope=qwen-2api
          cache-to: type=gha,mode=max,scope=qwen-2api

      - name: Build waf-harvester (Chromium sidecar)
        uses: docker/build-push-action@v6
        with:
          context: ./waf-harvester
          file: ./waf-harvester/Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: waf-harvester:1.0.0-arm64
          cache-from: type=gha,scope=waf-harvester
          cache-to: type=gha,mode=max,scope=waf-harvester

      - name: Save & compress both images
        run: |
          mkdir -p dist
          # qwen-2api 主镜像（轻量，无 zstd 压缩也够小，但仍压缩省带宽）
          QA_SRC="dist/qwen-2api-${BUILD_TAG}-arm64.tar"
          docker save qwen-2api:1.2.0-arm64 -o "$QA_SRC"
          zstd -T0 -19 --long=31 "$QA_SRC" && rm -f "$QA_SRC"
          # waf-harvester 侧车（含 Chromium，较大，必须压缩）
          WH_SRC="dist/waf-harvester-${BUILD_TAG}-arm64.tar"
          docker save waf-harvester:1.0.0-arm64 -o "$WH_SRC"
          zstd -T0 -19 --long=31 "$WH_SRC" && rm -f "$WH_SRC"
          ls -lh dist/
          echo "QA_ZST=qwen-2api-${BUILD_TAG}-arm64.tar.zst" >> "$GITHUB_ENV"
          echo "WH_ZST=waf-harvester-${BUILD_TAG}-arm64.tar.zst" >> "$GITHUB_ENV"

      - name: Upload qwen-2api artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-2api-arm64
          path: dist/qwen-2api-${{ env.BUILD_TAG }}-arm64.tar.zst
          retention-days: 14
          compression-level: 0

      - name: Upload waf-harvester artifact
        uses: actions/upload-artifact@v4
        with:
          name: waf-harvester-arm64
          path: dist/waf-harvester-${{ env.BUILD_TAG }}-arm64.tar.zst
          retention-days: 14
          compression-level: 0

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: qwen-2api ${{ env.BUILD_TAG }}
          files: |
            dist/qwen-2api-${{ env.BUILD_TAG }}-arm64.tar.zst
            dist/waf-harvester-${{ env.BUILD_TAG }}-arm64.tar.zst
          body: |
            ## 侧车架构镜像（arm64，zstd 压缩）

            两个镜像都需下载并 load：
            - `qwen-2api-*-arm64.tar.zst` — 主服务（轻量，无 Chromium）
            - `waf-harvester-*-arm64.tar.zst` — WAF 采集器（含 Chromium）

            ### 在 N1 上
            ```bash
            # OpenWrt 装 zstd：opkg install zstd
            zstd -d qwen-2api-${{ env.BUILD_TAG }}-arm64.tar.zst
            zstd -d waf-harvester-${{ env.BUILD_TAG }}-arm64.tar.zst
            docker load -i qwen-2api-${{ env.BUILD_TAG }}-arm64.tar
            docker load -i waf-harvester-${{ env.BUILD_TAG }}-arm64.tar
            docker compose -f docker-compose.n1.yml up -d
            ```
          allowUpdates: true

      - name: Summary
        run: |
          {
          echo "## 双镜像 arm64 构建完成 🎉"
          echo ""
          echo "| 产物 | 大小 |"
          echo "|------|------|"
          echo "| \`qwen-2api\`     | $(du -h dist/${QA_ZST} | cut -f1) |"
          echo "| \`waf-harvester\` | $(du -h dist/${WH_ZST} | cut -f1) |"
          echo ""
          echo "### 在 N1 上使用"
          echo '```bash'
          echo "zstd -d ${QA_ZST}"
          echo "zstd -d ${WH_ZST}"
          echo "docker load -i qwen-2api-${BUILD_TAG}-arm64.tar"
          echo "docker load -i waf-harvester-${BUILD_TAG}-arm64.tar"
          echo "docker compose -f docker-compose.n1.yml up -d"
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY"