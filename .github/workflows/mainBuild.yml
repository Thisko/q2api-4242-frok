name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          else
            echo "value=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Playwright image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .Dockerfile.playwright
          platforms: linux/arm64
          load: true
          tags: qwen-2api:playwright

      - name: Save image
        run: |
          docker save qwen-2api:playwright -o qwen-2api-playwright-${{ steps.tag.outputs.value }}-arm64.tar

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.tag.outputs.value }}
          name: qwen-2api ${{ steps.tag.outputs.value }}
          files: qwen-2api-playwright-${{ steps.tag.outputs.value }}-arm64.tar
