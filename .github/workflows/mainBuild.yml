name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v1.0.1
          git push origin v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.playwright
          platforms: linux/arm64
          load: true
          tags: qwen-2api:playwright

      - name: Save Docker image as tar
        run: |
          docker save qwen-2api:playwright -o qwen-2api-playwright-arm64.tar
          gzip -9 qwen-2api-playwright-arm64.tar

      - name: Create Release
        uses: softprops/
action-gh-release@v1
        with:
          files: qwen-2api-playwright-arm64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
