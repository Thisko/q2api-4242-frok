name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  PLATFORM: linux/arm64
  MAIN_IMAGE: ghcr.io/thisko/q2api
  HARVESTER_IMAGE: ghcr.io/thisko/qwaf-harvester

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VALUE="${GITHUB_REF##*/}"
          else
            VALUE="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          VALUE="$(printf '%s' "$VALUE" | tr -d '[:space:]')"
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TAG=${VALUE}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push qwen-2api (lightweight main image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ env.MAIN_IMAGE }}:${{ env.BUILD_TAG }}
            ${{ env.MAIN_IMAGE }}:latest
          cache-from: type=gha,scope=qwen-2api
          cache-to: type=gha,mode=max,scope=qwen-2api

      - name: Build & push waf-harvester (Chromium sidecar)
        uses: docker/build-push-action@v6
        with:
          context: ./waf-harvester
          file: ./waf-harvester/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ env.HARVESTER_IMAGE }}:${{ env.BUILD_TAG }}
            ${{ env.HARVESTER_IMAGE }}:latest
          cache-from: type=gha,scope=waf-harvester
          cache-to: type=gha,mode=max,scope=waf-harvester

      - name: Save & compress both images (for tar download fallback)
        run: |
          mkdir -p dist
          docker pull ${{ env.MAIN_IMAGE }}:${{ env.BUILD_TAG }}
          docker pull ${{ env.HARVESTER_IMAGE }}:${{ env.BUILD_TAG }}
          QA_SRC="dist/qwen-2api-${BUILD_TAG}-arm64.tar"
          docker save ${{ env.MAIN_IMAGE }}:${{ env.BUILD_TAG }} -o "$QA_SRC"
          zstd -T0 -19 --long=31 "$QA_SRC" && rm -f "$QA_SRC"
          WH_SRC="dist/waf-harvester-${BUILD_TAG}-arm64.tar"
          docker save ${{ env.HARVESTER_IMAGE }}:${{ env.BUILD_TAG }} -o "$WH_SRC"
          zstd -T0 -19 --long=31 "$WH_SRC" && rm -f "$WH_SRC"
          ls -lh dist/
          echo "QA_ZST=qwen-2api-${BUILD_TAG}-arm64.tar.zst" >> "$GITHUB_ENV"
          echo "WH_ZST=waf-harvester-${BUILD_TAG}-arm64.tar.zst" >> "$GITHUB_ENV"

      - name: Upload qwen-2api artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-2api-arm64
          path: dist/qwen-2api-${{ env.BUILD_TAG }}-arm64.tar.zst
          retention-days: 14
          compression-level: 0

      - name: Upload waf-harvester artifact
        uses: actions/upload-artifact@v4
        with:
          name: waf-harvester-arm64
          path: dist/waf-harvester-${{ env.BUILD_TAG }}-arm64.tar.zst
          retention-days: 14
          compression-level: 0

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: qwen-2api ${{ env.BUILD_TAG }}
          files: |
            dist/qwen-2api-${{ env.BUILD_TAG }}-arm64.tar.zst
            dist/waf-harvester-${{ env.BUILD_TAG }}-arm64.tar.zst
          body: |
            ## 侧车架构镜像（arm64）

            ### 方式一：直接从 GHCR 拉取（推荐）
            ```bash
            docker pull ${{ env.MAIN_IMAGE }}:${{ env.BUILD_TAG }}
            docker pull ${{ env.HARVESTER_IMAGE }}:${{ env.BUILD_TAG }}
            ```
            然后用 `docker-compose.n1.yml`（把 image 改成上面的地址）启动。

            ### 方式二：下载 tar + load（无外网时）
            ```bash
            opkg install zstd   # OpenWrt 装解压工具
            zstd -d qwen-2api-${{ env.BUILD_TAG }}-arm64.tar.zst
            zstd -d waf-harvester-${{ env.BUILD_TAG }}-arm64.tar.zst
            docker load -i qwen-2api-${{ env.BUILD_TAG }}-arm64.tar
            docker load -i waf-harvester-${{ env.BUILD_TAG }}-arm64.tar
            docker compose -f docker-compose.n1.yml up -d
            ```
          allowUpdates: true

      - name: Summary
        run: |
          {
          echo "## 双镜像 arm64 构建并推送到 GHCR 完成 🎉"
          echo ""
          echo "| 镜像 | pull 命令 |"
          echo "|------|-----------|"
          echo "| 主服务 | \`docker pull ${MAIN_IMAGE}:${BUILD_TAG}\` |"
          echo "| harvester | \`docker pull ${HARVESTER_IMAGE}:${BUILD_TAG}\` |"
          echo ""
          echo "### N1 上直接拉取使用"
          echo '```bash'
          echo "docker pull ${MAIN_IMAGE}:${BUILD_TAG}"
          echo "docker pull ${HARVESTER_IMAGE}:${BUILD_TAG}"
          echo "# 在 docker-compose.n1.yml 里把 image: 改成上面的地址，或用 :latest"
          echo "docker compose -f docker-compose.n1.yml up -d"
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY"